<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VCard EQUIPACC - JOSE C. CORREA PADRON</title>

<style>

.personal-table,
.personal-row,
.label,
.value{
    color:white;
}

.section-title{
    color:white;
    font-size:2rem;
    font-weight:700;
    margin-bottom:20px;
    padding-left:15px;
    border-left:6px solid #ffffff;
    text-align:left;
    display:block;
    width:100%;
}

body{
    min-height:100vh;
    background:url('Fondo.jpg') center center/cover no-repeat fixed;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px;
    position:relative;
}

body::before{
    content:'';
    position:fixed;
    inset:0;
    background:rgba(0,0,80,.30);
    backdrop-filter:blur(2px);
}

.personal-table{
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.18);
    border-radius:24px;
    overflow:hidden;
    backdrop-filter:blur(8px);
}

.personal-row{
    display:grid;
    grid-template-columns:180px 1fr;
    align-items:center;
    min-height:70px;
    border-bottom:1px solid rgba(255,255,255,.10);
}

.personal-row:last-child{
    border-bottom:none;
}

.label{
    padding:0 25px;
    color:white;
    font-size:1.3rem;
    font-weight:700;
}

.value{
    padding:0 25px;
    color:white;
    font-size:1.2rem;
}

@media(max-width:768px){

    .personal-row{
        grid-template-columns:1fr;
        padding:15px 0;
    }

    .label{
        padding:0 20px 5px;
    }

    .value{
        padding:0 20px;
    }

}

.container{
    position:relative;
    z-index:1;
    width:100%;
    max-width:700px;
    margin:auto;
}

.card{
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,.15);
    border-radius:30px;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.0);
    animation:fadeIn 1s ease;
}

.header{
    padding:20px;
    text-align:center;
    background:linear-gradient(
        135deg,
        rgba(255,255,255,0.98),
        rgba(255,255,255,0.95)
    );
    border-bottom:1px solid rgba(0,0,0,.08);

}

.logo{
    width:500px;
    max-width:100%;
    margin-bottom:10px;
}

.profile{
    display:flex;
    align-items:center;
    gap:35px;
    padding:40px;
    flex-wrap:wrap;
}

.photo{
    width:180px;
    height:180px;
    border-radius:50%;
    object-fit:cover;
    border:5px solid rgba(255,255,255,.35);
    box-shadow:0 0 35px rgba(0,120,255,.45);
}

.info{
    flex:1;
    color:white;
}

.info h1{
    font-size:2rem;
    margin-bottom:10px;
}

.position{
    display:inline-block;
    background:#000000;
    padding:10px 18px;
    border-radius:50px;
    font-weight:600;
    margin-bottom:20px;
}

.personal{
    display:grid;
    grid-template-columns:130px auto;
    gap:10px;
    font-size:.95rem;
}

.personal strong{
    color:#7fc7ff;
}

.section{
    padding:0 40px 40px;
}

.section-title{
    color:white;
    font-size:1.4rem;
    margin-bottom:25px;
    border-left:5px solid #ffffff;
    padding-left:15px;
}

.contact-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

.contact-card{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.10);
    padding:18px;
    border-radius:18px;
    color:white;
    transition:.3s;
}

.contact-card:hover{
    transform:translateY(-5px);
    background:rgba(255,255,255,.12);
}

.contact-card span{
    display:block;
    color:#7fc7ff;
    margin-bottom:5px;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:15px;
    margin-top:35px;
}

.btn{
    text-decoration:none;
    color:white;
    background:linear-gradient(135deg,#ffffff,#007cff);
    padding:14px 22px;
    border-radius:14px;
    font-weight:600;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-6px);
    box-shadow:0 10px 25px rgba(0,119,200,.35);
}

.socials{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
    margin-top:60px;
    margin-bottom:40px;
}

.socials a{
    text-decoration:none;
    color:white;
    padding:12px 18px;
    border-radius:12px;
    transition:.3s;
    font-weight:600;
}

.socials a:hover{
    transform:translateY(-3px);
}

/* Facebook */
.facebook{
    background:#1877F2;
}

.facebook:hover{
    background:#1664cc;
}

/* YouTube */
.youtube{
    background:#FF0000;
}

.youtube:hover{
    background:#cc0000;
}

/* TikTok */
.tiktok{
    background:#000000;
}

.tiktok:hover{
    background:#222222;
}

.footer{
    text-align:center;
    padding:25px;
    color:white;
    background:rgba(0,0,0,.25);
}

.whatsapp-float{
    position:fixed;
    right:20px;
    bottom:20px;
    width:70px;
    height:70px;
    border-radius:50%;
    background:#25D366;
    color:white;
    font-size:32px;
    text-decoration:none;
    display:flex;
    justify-content:center;
    align-items:center;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
    z-index:9999;
    transition:.3s;
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.08);}
    100%{transform:scale(1);}
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@media(max-width:768px){

    body{
        padding:15px;
        align-items:flex-start;
    }

    .container{
        max-width:100%;
    }

    .card{
        border-radius:20px;
    }

    .logo{
        width:220px;
        max-width:90%;
    }

    .profile{
        flex-direction:column;
        text-align:center;
        gap:20px;
        padding:25px;
    }

    .photo{
        width:150px;
        height:150px;
    }

    .info{
        width:100%;
    }

    .info h1{
        font-size:1.8rem;
        line-height:1.2;
        word-break:break-word;
    }

    .position{
        font-size:.9rem;
        padding:10px 20px;
    }

    .personal{
        grid-template-columns:1fr;
    }

    .header{
        padding:20px;
    }

    .section{
        padding:20px;
    }

    .contact-grid{
        grid-template-columns:1fr;
    }

    .contact-card{
        text-align:center;
    }

    .socials{
        flex-direction:column;
        align-items:center;
    }

    .socials a{
        width:220px;
        text-align:center;
    }

    .whatsapp-float{
        width:60px;
        height:60px;
        font-size:28px;
        right:15px;
        bottom:15px;
    }
}
</style>
